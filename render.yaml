services:
  # 1. Main n8n Instance (Web Service)
  - type: web
    name: n8n-main
    env: docker
    repo: https://github.com/render-examples/n8n # Or your own forked repository
    plan: free # External mode/Task runners require paid plans for resource allocation
    region: oregon # Use the same region for both services to minimize latency
    numInstances: 1
    healthCheckPath: /healthz
    envVars:
      - key: N8N_ENCRYPTION_KEY
        generateValue: true # Securely generates and persists encryption key on Render
      - key: WEBHOOK_URL
        sync: n8n-workflow-practice.onrender.com # Set this to your live Render URL manually after first deploy
      - key: N8N_RUNNERS_ENABLED
        value: true # Enforces external task runner mode
      - key: N8N_RUNNERS_MODE
        value: external
      - key: N8N_RUNNERS_MAIN_URL
        value: "http://localhost:5678" # Internal address for runner coordination
      - key: N8N_RUNNERS_AUTH_TOKEN
        generateValue: true # Generates a secure shared token to authenticate the runner
      
      # Database Configuration (Connect your external PostgreSQL)
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_HOST
        value: aws-0-ap-southeast-1.pooler.supabase.com
      - key: DB_POSTGRESDB_PORT
        value: 6543
      - key: DB_POSTGRESDB_DATABASE
        value: n8n_database
      - key: DB_POSTGRESDB_USER
        value: postgres.odtccfmczkyctwbsniqy
      - key: DB_POSTGRESDB_PASSWORD
        sync: admin@123Root # Prompt user to fill manually via Render UI

  # 2. n8n Task Runner (Background Worker Service)
  - type: worker
    name: n8n-task-runner
    env: docker
    dockerfilePath: ./Dockerfile.runner # Requires a Dockerfile pulling n8nio/runners
    plan: standard
    region: oregon # Must match n8n-main region
    numInstances: 1
    envVars:
      - key: N8N_RUNNERS_MAIN_URL
        fromService:
          name: n8n-main
          property: host # Uses Render's private networking to safely reach the main instance
      - key: N8N_RUNNERS_AUTH_TOKEN
        fromService:
          name: n8n-main
          property: envVar:N8N_RUNNERS_AUTH_TOKEN # Pulls the generated token from the main service
